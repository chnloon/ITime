<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载 OiGo 最新版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f2f7; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:20px; padding:32px 24px; max-width:420px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .logo { width:72px; height:72px; border-radius:18px; background:linear-gradient(135deg,#4da3ff,#007aff); color:#fff; font-size:34px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  h1 { font-size:22px; color:#1c1c1e; margin-bottom:6px; }
  .ver { color:#8e8e93; font-size:14px; margin-bottom:20px; }
  .wechat-tip { display:none; background:#fff7e6; border:1px solid #ffd591; color:#ad6800; border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.6; margin-bottom:16px; }
  .btn { display:block; background:#007aff; color:#fff; text-decoration:none; border-radius:24px; padding:14px; font-size:16px; font-weight:600; margin-bottom:12px; }
  .btn2 { background:#f2f2f7; color:#007aff; }
  .tip { color:#8e8e93; font-size:12px; line-height:1.6; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Oi</div>
  <h1>OiGo 日程提醒</h1>
  <p class="ver" id="ver">正在获取最新版本...</p>
  <div class="wechat-tip" id="wechatTip">⚠️ 微信/QQ 内无法直接下载安装包，请点击右上角「···」→「在浏览器中打开」，即可正常下载。</div>
  <a class="btn" id="dlArm" href="javascript:void(0)">点击下载（主流手机）</a>
  <a class="btn btn2" id="dlV7" href="javascript:void(0)">下载兼容版（老机型）</a>
  <p class="tip">下载后点击安装；如提示未知来源，请在系统设置中允许。</p>
</div>
<script>
(function(){
  if (/MicroMessenger|QQ\//i.test(navigator.userAgent)) {
    document.getElementById('wechatTip').style.display = 'block';
  }
  // 兜底地址（v1.1.15）
  var fb = {
    ver: '1.1.15',
    arm: 'https://cdn.jsdelivr.net/gh/chnloon/ITime@main/apk/oigo-arm64-v8a-v38.apk',
    v7:  'https://cdn.jsdelivr.net/gh/chnloon/ITime@main/apk/oigo-armeabi-v7a-v38.apk'
  };
  function apply(d){
    document.getElementById('ver').textContent = '最新版本 v' + d.versionName;
    document.getElementById('dlArm').href = d.urls['arm64-v8a'];
    document.getElementById('dlV7').href = d.urls['armeabi-v7a'];
  }
  // GitHub API 读取最新清单（支持跨域）
  fetch('https://api.github.com/repos/chnloon/ITime/contents/latest.json', { headers: { 'User-Agent': 'OiGo' } })
    .then(function(r){ return r.json(); })
    .then(function(b){
      var txt = decodeURIComponent(escape(atob(b.content.replace(/\s/g,''))));
      apply(JSON.parse(txt));
    })
    .catch(function(){ apply(fb); });
})();
</script>
</body>
</html>
